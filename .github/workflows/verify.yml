name: Verify site and launch switch

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOW_MEDICALGERMAN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run build && npm run build:preview
      - run: npm test
      - run: npm run test:launch:browser
      - run: npm run test:consent:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-browser-review
          path: |
            artifacts/launch-browser-review.json
            artifacts/screenshots/launch-*.png
            artifacts/consent-browser-review.json
            artifacts/screenshots/consent-*.png
          if-no-files-found: ignore
